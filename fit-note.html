<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="轻盈日记">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>轻盈日记</title>
  <style>
    :root{--ink:#25362c;--muted:#718078;--paper:#fbf8f2;--panel:#fffefa;--line:#e8e2d7;--green:#24734c;--mint:#dff2df;--orange:#c86425;--peach:#ffe6d7;--red:#b64d42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px}main{max-width:560px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(35px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 21px}h1{font-size:27px;margin:0;letter-spacing:-.8px}.date{font-size:14px;color:var(--muted)}.hero{background:var(--ink);border-radius:24px;padding:21px;color:#fff;box-shadow:0 9px 24px #25362c20}.hero-top{display:flex;align-items:baseline;justify-content:space-between}.hero strong{font-size:34px;letter-spacing:-1px}.hero span{font-size:14px;color:#cad5cd}.goal{font-size:13px;color:#d7e3d9}.bar{height:9px;background:#ffffff32;border-radius:9px;margin:17px 0 9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:#a7e2aa;transition:width .3s}.balance{font-size:14px;color:#d6e7d8}section{margin-top:26px}h2{font-size:18px;margin:0 0 12px;letter-spacing:-.2px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:15px}.stat small{color:var(--muted);display:block;margin-bottom:6px}.stat b{font-size:22px;letter-spacing:-.5px}.stat.orange{background:var(--peach);border-color:#f7d7c3}.stat.green{background:var(--mint);border-color:#cde8cf}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);background:var(--panel);padding:14px 11px;border-radius:16px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:73px}.quick button:active{transform:scale(.98)}.quick b{font-size:15px;display:block}.quick small{color:var(--muted);font-size:13px;margin-top:5px;display:block}.add{width:100%;background:var(--green);color:white;border:0;border-radius:16px;font:600 16px inherit;padding:15px;margin-top:11px;cursor:pointer}.add:active{background:#1b5e3d}.list{display:flex;flex-direction:column;gap:8px}.row{background:var(--panel);border:1px solid var(--line);padding:12px 13px;border-radius:14px;display:flex;align-items:center;gap:11px}.row .icon{width:33px;height:33px;display:grid;place-items:center;border-radius:11px;background:var(--mint);font-size:17px}.row.food .icon{background:var(--peach)}.row .entry{flex:1;min-width:0}.row b{font-size:15px}.row small{display:block;color:var(--muted);margin-top:3px;font-size:13px}.row .kcal{font-weight:650;font-size:14px;white-space:nowrap}.del{border:0;background:none;color:#a0aaa2;font-size:22px;line-height:1;cursor:pointer;padding:5px}.empty{color:var(--muted);font-size:14px;padding:7px 2px}.settings{margin-top:26px;border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:5px 0}.modal{position:fixed;inset:0;background:#25362c70;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:17px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}.handle{width:38px;height:4px;border-radius:4px;background:#c3c9c3;margin:0 auto 18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet h3{margin:0;font-size:21px}.close{border:0;background:none;font-size:26px;color:var(--muted);padding:0 5px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.choice{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:10px 5px;text-align:center;font:14px inherit;color:var(--ink);cursor:pointer}.choice.active{border-color:var(--green);background:var(--mint);color:var(--green);font-weight:600}.field{display:block;margin:12px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid #d8d5ca;border-radius:12px;padding:13px;font:16px inherit;background:#fff}.rowfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:white;font:600 16px inherit;margin-top:10px}.save:disabled{opacity:.45}.note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5}@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}@media(max-width:360px){.quick{grid-template-columns:1fr}.hero strong{font-size:30px}}
  </style>
</head>
<body><main>
  <header><div><h1>轻盈日记</h1><div class="date" id="date"></div></div><span aria-label="健康记录">🌿</span></header>
  <div class="hero"><div class="hero-top"><div><div class="goal">今日净摄入</div><strong id="net">0</strong> <span>千卡</span></div><span id="goalText">目标 1,600 千卡</span></div><div class="bar"><i id="bar"></i></div><div class="balance" id="balance">还可以摄入 1,600 千卡</div></div>
  <section><h2>今天的收支</h2><div class="stats"><div class="stat orange"><small>食物摄入</small><b id="foodTotal">0</b> 千卡</div><div class="stat green"><small>运动消耗</small><b id="sportTotal">0</b> 千卡</div></div></section>
  <section><h2>快捷记录</h2><div class="quick"><button data-kind="sport" data-name="散步" data-kcal="120">🚶 <b>散步</b><small>约 30 分钟 · 120 千卡</small></button><button data-kind="sport" data-name="跑步" data-kcal="300">🏃 <b>跑步</b><small>约 30 分钟 · 300 千卡</small></button><button data-kind="food" data-name="一碗米饭" data-kcal="232">🍚 <b>一碗米饭</b><small>约 232 千卡</small></button><button data-kind="food" data-name="鸡胸肉" data-kcal="165">🍗 <b>鸡胸肉</b><small>约 100 克 · 165 千卡</small></button></div><button class="add" id="openAdd">＋ 添加一条记录</button></section>
  <section><h2>今日明细</h2><div class="list" id="list"></div></section><button class="settings" id="openGoal">设置每日净摄入目标</button>
</main>
<div class="modal" id="modal"><form class="sheet" id="entryForm"><div class="handle"></div><div class="sheet-head"><h3>添加记录</h3><button class="close" type="button" data-close>×</button></div><div class="choices"><button class="choice active" type="button" data-type="food">🍽️ 吃了什么</button><button class="choice" type="button" data-type="sport">🏃 做了运动</button></div><label class="field"><span id="nameLabel">食物名称</span><input required id="name" placeholder="例如：番茄鸡蛋面" maxlength="30"></label><div class="rowfields"><label class="field"><span>热量（千卡）</span><input required id="kcal" type="number" min="1" inputmode="decimal" placeholder="例如：420"></label><label class="field" id="extraField"><span>餐次（可选）</span><input id="extra" placeholder="早餐 / 午餐"></label></div><button class="save">保存记录</button></form></div>
<div class="modal" id="goalModal"><form class="sheet" id="goalForm"><div class="handle"></div><div class="sheet-head"><h3>每日净摄入目标</h3><button class="close" type="button" data-close>×</button></div><label class="field"><span>目标热量（千卡）</span><input required id="goalInput" type="number" min="500" max="5000" inputmode="numeric"></label><p class="note">净摄入 = 食物摄入 − 运动消耗。目标可按你的计划自行调整。</p><button class="save">保存目标</button></form></div>
<script>
const key='fit-note-v1';let state=JSON.parse(localStorage.getItem(key)||'{"goal":1600,"entries":[]}');let type='food';
const $=s=>document.querySelector(s);const persist=()=>localStorage.setItem(key,JSON.stringify(state));
function fmt(n){return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0})}function today(){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}
function render(){let food=state.entries.filter(x=>x.type==='food').reduce((a,x)=>a+x.kcal,0),sport=state.entries.filter(x=>x.type==='sport').reduce((a,x)=>a+x.kcal,0),net=food-sport,left=state.goal-net;$('#date').textContent=today();$('#foodTotal').textContent=fmt(food);$('#sportTotal').textContent=fmt(sport);$('#net').textContent=fmt(net);$('#goalText').textContent='目标 '+fmt(state.goal)+' 千卡';$('#bar').style.width=Math.min(100,Math.max(0,net/state.goal*100))+'%';$('#balance').textContent=left>=0?'还可以摄入 '+fmt(left)+' 千卡':'已超出目标 '+fmt(-left)+' 千卡';const list=$('#list');list.innerHTML=state.entries.length?state.entries.slice().reverse().map(x=>`<div class="row ${x.type}"><div class="icon">${x.type==='food'?'🍽️':'🏃'}</div><div class="entry"><b>${esc(x.name)}</b><small>${x.type==='food'?(esc(x.extra)||'饮食'):'运动消耗'}</small></div><span class="kcal">${x.type==='food'?'+':'−'}${fmt(x.kcal)} 千卡</span><button class="del" data-id="${x.id}" aria-label="删除 ${esc(x.name)}">×</button></div>`).join(''):'<div class="empty">还没有记录，先从一餐或一次运动开始吧。</div>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function modal(id,on){$('#'+id).classList.toggle('show',on)}
function setType(t){type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('#nameLabel').textContent=t==='food'?'食物名称':'运动名称';$('#name').placeholder=t==='food'?'例如：番茄鸡蛋面':'例如：跳绳 20 分钟';$('#extraField').style.visibility=t==='food'?'visible':'hidden'}
$('#openAdd').onclick=()=>{setType('food');$('#entryForm').reset();modal('modal',true);$('#name').focus()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{state.entries.push({id:Date.now(),type:b.dataset.kind,name:b.dataset.name,kcal:+b.dataset.kcal,extra:''});persist();render()});
$('#entryForm').onsubmit=e=>{e.preventDefault();state.entries.push({id:Date.now(),type,name:$('#name').value.trim(),kcal:+$('#kcal').value,extra:$('#extra').value.trim()});persist();render();modal('modal',false)};
$('#list').onclick=e=>{let id=e.target.dataset.id;if(id){state.entries=state.entries.filter(x=>String(x.id)!==id);persist();render()}};
$('#openGoal').onclick=()=>{$('#goalInput').value=state.goal;modal('goalModal',true);$('#goalInput').focus()};$('#goalForm').onsubmit=e=>{e.preventDefault();state.goal=+$('#goalInput').value;persist();render();modal('goalModal',false)};document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)modal(m.id,false)});render();
</script><script>
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
