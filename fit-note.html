<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="轻盈日记"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>轻盈日记</title><style>
:root{--i:#25362c;--g:#24734c;--m:#dff2df;--p:#fffefa;--l:#e8e2d7;--o:#ffe6d7;--t:#718078}*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:var(--i);font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:560px;margin:auto;padding:22px 16px 38px}h1{margin:0;font-size:28px}h2{font-size:18px;margin:0}.muted,small{color:var(--t);font-size:13px}.head,.sectionHead,.top{display:flex;justify-content:space-between;align-items:center}.hero{margin-top:18px;padding:20px;border-radius:23px;background:var(--i);color:white}.hero b{font-size:35px}.bar{height:9px;background:#ffffff33;border-radius:8px;margin:16px 0 9px}.bar i{height:100%;display:block;background:#a7e2aa;border-radius:8px}.card{border:1px solid var(--l);background:var(--p);border-radius:16px;padding:14px}.plan{background:var(--m);border-color:#cde8cf}.stats,.quick,.meals{display:grid;gap:9px}.stats,.quick{grid-template-columns:1fr 1fr}.meals{grid-template-columns:repeat(3,1fr);margin-top:11px}.meal{text-align:center;background:#ffffff8f;border-radius:10px;padding:8px}.stat b{display:block;font-size:22px;margin-top:5px}.orange{background:var(--o)}section{margin-top:25px}.sectionHead{margin-bottom:11px}.quick button,.add,.save,.outline{font:inherit;border-radius:14px;padding:13px;cursor:pointer}.quick button{text-align:left;border:1px solid var(--l);background:var(--p);min-height:70px;color:var(--i)}.quick b{display:block}.add,.save{width:100%;border:0;background:var(--g);color:#fff;margin-top:10px;font-weight:600}.link,.del,.edit,.close{border:0;background:none;color:var(--g);cursor:pointer;font:inherit}.list{display:grid;gap:8px}.entry{display:flex;align-items:center;gap:10px}.entry .body{flex:1}.entry .icon{background:var(--m);border-radius:10px;padding:8px}.food .icon{background:var(--o)}.kcal{white-space:nowrap;font-weight:600}.del{color:#8b968e;font-size:20px}.modal{display:none;position:fixed;inset:0;background:#25362c7a;align-items:end;z-index:9}.modal.show{display:flex}.sheet{max-width:560px;width:100%;margin:auto;max-height:92vh;overflow:auto;background:#f8f6ef;border-radius:23px 23px 0 0;padding:16px 18px 28px}.handle{height:4px;width:38px;background:#c3c9c3;border-radius:4px;margin:0 auto 15px}.field{display:block;margin:11px 0}.field span{display:block;font-size:13px;color:var(--t);margin-bottom:5px}input,select{width:100%;font:16px inherit;padding:12px;border:1px solid #d8d5ca;border-radius:11px;background:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.type{border:1px solid var(--l);background:var(--p);border-radius:11px;padding:10px;color:var(--i)}.type.active{border-color:var(--g);background:var(--m);color:var(--g)}.preset{border-bottom:1px solid var(--l);padding:10px 0;display:flex;align-items:center;gap:8px}.preset .body{flex:1}.outline{width:100%;border:1px dashed #80a986;background:none;color:var(--g);margin-top:12px}.warning{font-size:12px;color:#85471e;margin-top:9px}@media(max-width:360px){.stats,.quick,.fields{grid-template-columns:1fr}.meals{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<div class="head"><div><h1>轻盈日记</h1><span class="muted" id="date"></span></div><span>🌿</span></div><div class="hero"><div class="top"><div><small>今日净摄入</small><br><b id="net">0</b> 千卡</div><small id="goalText">请设置计划</small></div><div class="bar"><i id="bar"></i></div><span id="balance">设置计划后显示热量收支</span></div>
<section><div class="sectionHead"><h2>你的减脂计划</h2><button class="link" id="profileOpen">设置 / 调整</button></div><div class="card plan" id="plan"></div></section>
<section><h2>今天的收支</h2><div class="stats"><div class="card orange stat"><small>食物摄入</small><b id="food">0</b>千卡</div><div class="card plan stat"><small>运动消耗</small><b id="sport">0</b>千卡</div></div></section>
<section><div class="sectionHead"><h2>快捷记录</h2><button class="link" id="presetsOpen">管理快捷项</button></div><div class="quick" id="quick"></div><button class="add" id="entryOpen">＋ 添加一条记录</button></section><section><h2>今日明细</h2><div class="list" id="entries"></div></section><button class="link" id="manualOpen" style="margin-top:24px">手动设置每日热量目标</button>
</main>
<div class="modal" id="entryModal"><form class="sheet" id="entryForm"><div class="handle"></div><div class="top"><h2>添加记录</h2><button class="close" type="button">×</button></div><div class="types"><button class="type active" type="button" data-kind="food">🍽️ 吃了什么</button><button class="type" type="button" data-kind="sport">🏃 做了运动</button></div><label class="field"><span id="entryLabel">食物名称</span><input id="entryName" required></label><div class="fields"><label class="field"><span>热量（千卡）</span><input id="entryKcal" required type="number" min="1"></label><label class="field" id="mealField"><span>餐次（可选）</span><input id="entryExtra" placeholder="早餐 / 午餐"></label></div><button class="save">保存记录</button></form></div>
<div class="modal" id="profileModal"><form class="sheet" id="profileForm"><div class="handle"></div><div class="top"><h2>我的减脂计划</h2><button class="close" type="button">×</button></div><div class="fields"><label class="field"><span>性别</span><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></label><label class="field"><span>年龄</span><input id="age" required type="number" min="14" max="100"></label><label class="field"><span>身高（厘米）</span><input id="height" required type="number" min="120" max="230"></label><label class="field"><span>当前体重（公斤）</span><input id="weight" required type="number" min="30" max="300" step=".1"></label></div><label class="field"><span>目标体重（公斤）</span><input id="targetWeight" required type="number" min="30" max="300" step=".1"></label><label class="field"><span>日常活动量</span><select id="activity"><option value="1.2">久坐（很少运动）</option><option value="1.375">轻度（每周 1–3 天运动）</option><option value="1.55">中度（每周 3–5 天运动）</option><option value="1.725">较高（每周 6–7 天运动）</option></select></label><div class="fields"><label class="field"><span>每周计划减重</span><select id="loss"><option value=".25">约 0.25 公斤</option><option value=".5">约 0.5 公斤</option><option value=".75">约 0.75 公斤</option></select></label><label class="field"><span>每天几餐</span><select id="meals"><option value="3">3 餐</option><option value="4">4 餐（含加餐）</option></select></label></div><p class="muted">使用 Mifflin–St Jeor 公式估算。孕期、哺乳期、未成年人或有疾病时，请咨询医生或营养师。</p><button class="save">保存并计算</button></form></div>
<div class="modal" id="presetModal"><div class="sheet"><div class="handle"></div><div class="top"><h2>管理快捷记录</h2><button class="close" type="button">×</button></div><div id="presetList"></div><button class="outline" id="presetNew">＋ 新增快捷项</button></div></div>
<div class="modal" id="presetEditModal"><form class="sheet" id="presetForm"><div class="handle"></div><div class="top"><h2 id="presetTitle">新增快捷项</h2><button class="close" type="button">×</button></div><div class="types"><button class="type active" type="button" data-pkind="food">🍽️ 饮食</button><button class="type" type="button" data-pkind="sport">🏃 运动</button></div><label class="field"><span>名称</span><input id="presetName" required></label><label class="field"><span>热量（千卡）</span><input id="presetKcal" required type="number" min="1"></label><button class="save">保存快捷项</button></form></div>
<div class="modal" id="manualModal"><form class="sheet" id="manualForm"><div class="handle"></div><div class="top"><h2>手动热量目标</h2><button class="close" type="button">×</button></div><label class="field"><span>每日净摄入目标（千卡）</span><input id="manualGoal" required type="number" min="500" max="5000"></label><button class="save">保存目标</button></form></div>
<script>
const D=[['sport','散步',120],['sport','跑步',300],['food','一碗米饭',232],['food','鸡胸肉',165]],K='fit-note-v3',$=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString('zh-CN');let s=JSON.parse(localStorage.getItem(K)||'null')||{entries:[],presets:D.map((x,i)=>({id:'p'+i,type:x[0],name:x[1],kcal:x[2]})),profile:null,manual:null},kind='food',pkind='food',editing=null;const save=()=>localStorage.setItem(K,JSON.stringify(s));
function target(){if(s.manual)return{goal:s.manual};let p=s.profile;if(!p)return null;let b=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161),raw=b*p.activity-p.loss*1100,floor=p.sex==='male'?1500:1200;return{goal:Math.round(Math.max(raw,floor)),low:raw<floor}}
function open(id){$('#'+id).classList.add('show')}function close(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}function type(t){kind=t;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x.dataset.kind===t));$('#entryLabel').textContent=t==='food'?'食物名称':'运动名称';$('#mealField').style.visibility=t==='food'?'visible':'hidden'}function ptype(t){pkind=t;document.querySelectorAll('[data-pkind]').forEach(x=>x.classList.toggle('active',x.dataset.pkind===t))}
function render(){let a=s.entries.filter(x=>x.type==='food').reduce((n,x)=>n+x.kcal,0),b=s.entries.filter(x=>x.type==='sport').reduce((n,x)=>n+x.kcal,0),n=a-b,t=target();$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());$('#food').textContent=f(a);$('#sport').textContent=f(b);$('#net').textContent=f(n);$('#goalText').textContent=t?'目标 '+f(t.goal)+' 千卡':'请设置计划';$('#bar').style.width=t?Math.min(100,Math.max(0,n/t.goal*100))+'%':'0';$('#balance').textContent=t?(n<=t.goal?'还可以摄入 '+f(t.goal-n)+' 千卡':'已超出目标 '+f(n-t.goal)+' 千卡'):'设置计划后显示热量收支';let p=s.profile;if(!p)$('#plan').innerHTML='<b>先创建你的计划</b><br><span class="muted">填写身高、体重与目标后，我会计算每天和每餐建议。</span>';else{let w=p.meals==4?[.25,.3,.3,.15]:[.3,.4,.3],names=p.meals==4?['早餐','午餐','晚餐','加餐']:['早餐','午餐','晚餐'];$('#plan').innerHTML=`<b>每日建议 ${f(t.goal)} 千卡</b><span class="muted"> · 距目标约 ${f(Math.max(0,p.weight-p.targetWeight))} 公斤</span><div class="meals">${w.map((x,i)=>`<div class="meal"><small>${names[i]}</small><br><b>${f(t.goal*x)}</b><small> 千卡</small></div>`).join('')}</div>${t.low?'<div class="warning">为避免目标过低，已使用每日最低参考值。</div>':''}`};$('#quick').innerHTML=s.presets.map(x=>`<button data-p="${x.id}">${x.type==='food'?'🍽️':'🏃'} <b>${x.name}</b><small>${x.type==='food'?'摄入':'消耗'} ${f(x.kcal)} 千卡</small></button>`).join('');$('#entries').innerHTML=s.entries.length?s.entries.slice().reverse().map(x=>`<div class="card entry ${x.type}"><span class="icon">${x.type==='food'?'🍽️':'🏃'}</span><div class="body"><b>${x.name}</b><br><small>${x.type==='food'?(x.extra||'饮食'):'运动消耗'}</small></div><span class="kcal">${x.type==='food'?'+':'−'}${f(x.kcal)}</span><button class="del" data-del="${x.id}">×</button></div>`).join(''):'<span class="muted">还没有记录，先从一餐或一次运动开始吧。</span>'}
$('#entryOpen').onclick=()=>{$('#entryForm').reset();type('food');open('entryModal')};document.querySelectorAll('[data-kind]').forEach(x=>x.onclick=()=>type(x.dataset.kind));$('#entryForm').onsubmit=e=>{e.preventDefault();s.entries.push({id:Date.now(),type:kind,name:$('#entryName').value,kcal:+$('#entryKcal').value,extra:$('#entryExtra').value});save();render();close()};$('#quick').onclick=e=>{let x=s.presets.find(x=>x.id===e.target.closest('button')?.dataset.p);if(x){s.entries.push({...x,id:Date.now(),extra:''});save();render()}};$('#entries').onclick=e=>{if(e.target.dataset.del){s.entries=s.entries.filter(x=>x.id!=e.target.dataset.del);save();render()}};
$('#profileOpen').onclick=()=>{let p=s.profile||{sex:'female',age:'',height:'',weight:'',targetWeight:'',activity:1.2,loss:.5,meals:3};Object.keys(p).forEach(k=>$('#'+k).value=p[k]);open('profileModal')};$('#profileForm').onsubmit=e=>{e.preventDefault();s.profile={sex:$('#sex').value,age:+$('#age').value,height:+$('#height').value,weight:+$('#weight').value,targetWeight:+$('#targetWeight').value,activity:+$('#activity').value,loss:+$('#loss').value,meals:+$('#meals').value};s.manual=null;save();render();close()};
function presets(){ $('#presetList').innerHTML=s.presets.map(x=>`<div class="preset"><span>${x.type==='food'?'🍽️':'🏃'}</span><div class="body"><b>${x.name}</b><br><small>${f(x.kcal)} 千卡</small></div><button class="edit" data-edit="${x.id}">编辑</button><button class="del" data-remove="${x.id}">×</button></div>`).join('')||'<span class="muted">还没有快捷项</span>'}$('#presetsOpen').onclick=()=>{presets();open('presetModal')};$('#presetList').onclick=e=>{let id=e.target.dataset.edit||e.target.dataset.remove;if(!id)return;if(e.target.dataset.remove){s.presets=s.presets.filter(x=>x.id!==id);save();render();presets();return}let x=s.presets.find(x=>x.id===id);editing=id;$('#presetTitle').textContent='编辑快捷项';$('#presetName').value=x.name;$('#presetKcal').value=x.kcal;ptype(x.type);open('presetEditModal')};$('#presetNew').onclick=()=>{editing=null;$('#presetForm').reset();$('#presetTitle').textContent='新增快捷项';ptype('food');open('presetEditModal')};document.querySelectorAll('[data-pkind]').forEach(x=>x.onclick=()=>ptype(x.dataset.pkind));$('#presetForm').onsubmit=e=>{e.preventDefault();let x={id:editing||'p'+Date.now(),type:pkind,name:$('#presetName').value,kcal:+$('#presetKcal').value};s.presets=editing?s.presets.map(z=>z.id===editing?x:z):[...s.presets,x];save();render();presets();$('#presetEditModal').classList.remove('show')};
$('#manualOpen').onclick=()=>{$('#manualGoal').value=target()?.goal||1600;open('manualModal')};$('#manualForm').onsubmit=e=>{e.preventDefault();s.manual=+$('#manualGoal').value;save();render();close()};document.querySelectorAll('.close').forEach(x=>x.onclick=close);document.querySelectorAll('.modal').forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('show')});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
